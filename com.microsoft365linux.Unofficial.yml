app-id: com.microsoft365linux.Unofficial
runtime: org.gnome.Platform
runtime-version: "46"
sdk: org.gnome.Sdk
command: m365-linux

finish-args:
  # Comunicação de rede e IPC
  - --share=network
  - --share=ipc

  # Servidores de exibição gráfica
  - --socket=wayland
  - --socket=fallback-x11

  # Aceleração gráfica por hardware (DRI)
  - --device=dri

  # Áudio do sistema (PulseAudio / PipeWire para o som das notificações Fluent 2)
  - --socket=pulseaudio

  # Notificações do sistema e Portais
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.portal.Notification
  - --talk-name=org.freedesktop.portal.Background

  # Suporte à bandeja do sistema (Tray / StatusNotifier)
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=org.kde.StatusNotifierItem

  # Barramentos GVfs / GIO para gravação de metadados no gerenciador de arquivos
  - --talk-name=org.gtk.vfs
  - --talk-name=org.gtk.vfs.*

  # Acesso ao sistema de arquivos do usuário
  - --filesystem=home
  - --filesystem=xdg-config/onedrive:create

cleanup:
  - /ldc
  - /share/icons/hicolor/scalable/places/onedrive.svg
  - /share/icons/hicolor/scalable/apps/onedrive-notifications.svg

modules:
  # Compilador D necessário exclusivamente para build do abraunegg/onedrive
  - name: ldc
    buildsystem: simple
    sources:
      - type: archive
        url: https://github.com/ldc-developers/ldc/releases/download/v1.36.0/ldc2-1.36.0-linux-x86_64.tar.xz
        sha256: 2d418462d1c3909f5889298d97de061d023850a371ea9d418fc3fd2d4b7e8b19
    build-commands:
      - mkdir -p /app/ldc
      - cp -a . /app/ldc/

  # Daemon do OneDrive
  - name: onedrive
    buildsystem: simple
    sources:
      - type: git
        url: https://github.com/abraunegg/onedrive.git
        commit: 0b7299adb170d789d27d517963bc65fb04e0bd63
    build-options:
      env:
        DC: ldc2
      append-path: /app/ldc/bin
      append-ld-library-path: /app/ldc/lib
    build-commands:
      - ./configure --prefix=/app
      - make -j${FLATPAK_BUILDER_N_JOBS}
      - make install

  # Aplicação Microsoft 365 for Linux
  - name: microsoft365-for-linux
    buildsystem: simple
    sources:
      - type: dir
        path: .
    build-commands:
      - mkdir -p /app/share/microsoft365
      - mkdir -p /app/share/microsoft365/assets
      - mkdir -p /app/bin
      - cp -r src /app/share/microsoft365/
      - cp m365-linux /app/bin/m365-linux
      - chmod +x /app/bin/m365-linux

      - install -Dm644 desktop/com.microsoft365linux.Unofficial.desktop /app/share/applications/com.microsoft365linux.Unofficial.desktop
      - install -Dm644 icons/hicolor/512x512/apps/com.microsoft365linux.Unofficial.png /app/share/icons/hicolor/512x512/apps/com.microsoft365linux.Unofficial.png
      - install -Dm644 assets/m365-tray.png /app/share/microsoft365/assets/m365-tray.png
      - install -Dm644 assets/onedrive-folder.png /app/share/microsoft365/assets/onedrive-folder.png
